<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Settings – e-Minimal</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/app.js" defer></script>
    <style>
      /* Settings-specific; everything else comes from /css/app.css */
      body[data-page="settings"] .section-layout.no-nav { grid-template-columns: minmax(0, 1fr); }
      body[data-page="settings"] .no-nav .section-nav { display: none; }
      body[data-page="settings"] .card[id^="section-"] { scroll-margin-top: calc(var(--topbar-h) + 16px); }
      body[data-page="settings"] .entry + .entry { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--rule); }
      body[data-page="settings"] .row.actions { justify-content: flex-end; gap: 8px; }
      body[data-page="settings"] .add-row { padding-top: 12px; }
    </style>
  </head>
  <body data-page="settings" data-title="Settings">
    <main>
      <div class="section-layout no-nav">
        <nav class="section-nav" aria-label="Sections">
          <div class="section-links" id="section-links"></div>
          <div class="field section-select">
            <label for="sectionSelect">Section</label>
            <select id="sectionSelect"></select>
          </div>
        </nav>
        <div>
          <div id="settings-container">
            <p class="empty"><span class="spinner" aria-hidden="true"></span> Loading settings…</p>
          </div>
          <div id="wifi-container"></div>
          <div id="opds-container"></div>
        </div>
      </div>

      <div class="savebar" id="save-container">
        <span id="save-summary"></span>
        <button class="btn btn-primary" id="saveBtn" onclick="saveSettings()">Save changes</button>
      </div>
    </main>

<script>
  let allSettings = [];
  let originalValues = {};
  let preserveQuickResumeTimeoutOn = false;
  let quickResumeTimeoutAutoEnabled = false;
  const SLEEP_SCREEN_MODE = {
    QUICK_RESUME: 6
  };

  function escapeHtml(unsafe) {
    return unsafe
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function showMessage(text, isError) {
    ui.toast(text, isError ? 'danger' : 'ok');
  }

  function renderControl(setting) {
    const id = 'setting-' + setting.key;

    if (setting.type === 'toggle') {
      const checked = setting.value ? 'checked' : '';
      return '<label class="toggle" aria-label="' + escapeHtml(setting.name) + '">' +
        '<input type="checkbox" id="' + id + '" ' + checked + ' onchange="handleSettingChanged(\'' + setting.key + '\')">' +
        '<span></span></label>';
    }

    if (setting.type === 'enum') {
      let html = '<span class="row-control"><select id="' + id + '" onchange="handleSettingChanged(\'' + setting.key + '\')">';
      setting.options.forEach(function(opt, idx) {
        const selected = idx === setting.value ? ' selected' : '';
        html += '<option value="' + idx + '"' + selected + '>' + escapeHtml(opt) + '</option>';
      });
      html += '</select></span>';
      return html;
    }

    if (setting.type === 'value') {
      return '<span class="row-control"><input type="number" id="' + id + '" value="' + setting.value + '"' +
        ' min="' + setting.min + '" max="' + setting.max + '" step="' + setting.step + '"' +
        ' onchange="handleSettingChanged(\'' + setting.key + '\')"></span>';
    }

    if (setting.type === 'string') {
      const inputType = setting.name.toLowerCase().includes('password') ? 'password' : 'text';
      const val = setting.value || '';
      return '<span class="row-control"><input type="' + inputType + '" id="' + id + '" value="' + escapeHtml(val) + '"' +
        ' oninput="handleSettingChanged(\'' + setting.key + '\')"></span>';
    }

    return '';
  }

  function getValue(setting) {
    const el = document.getElementById('setting-' + setting.key);
    if (!el) return undefined;

    if (setting.type === 'toggle') {
      return el.checked ? 1 : 0;
    }
    if (setting.type === 'enum') {
      return parseInt(el.value, 10);
    }
    if (setting.type === 'value') {
      return parseInt(el.value, 10);
    }
    if (setting.type === 'string') {
      return el.value;
    }
    return undefined;
  }

  // The save bar shows only while something differs from what was loaded.
  function updateSaveBar() {
    let count = 0;
    allSettings.forEach(function(s) {
      const current = getValue(s);
      if (current !== undefined && current !== originalValues[s.key]) count++;
    });
    document.getElementById('save-summary').textContent = count + (count === 1 ? ' change' : ' changes');
    document.getElementById('save-container').classList.toggle('show', count > 0);
  }

  function markChanged() {
    document.getElementById('saveBtn').disabled = false;
    updateSaveBar();
  }

  function findSetting(key) {
    return allSettings.find(function(s) { return s.key === key; });
  }

  function getControl(key) {
    return document.getElementById('setting-' + key);
  }

  function getControlValue(key) {
    const setting = findSetting(key);
    const el = getControl(key);
    if (!setting || !el) return undefined;

    if (setting.type === 'toggle') {
      return el.checked ? 1 : 0;
    }
    if (setting.type === 'enum' || setting.type === 'value') {
      return parseInt(el.value, 10);
    }
    return el.value;
  }

  function setControlValue(key, value) {
    const setting = findSetting(key);
    const el = getControl(key);
    if (!setting || !el) return false;

    if (setting.type === 'toggle') {
      const checked = !!value;
      if (el.checked === checked) return false;
      el.checked = checked;
      return true;
    }

    const nextValue = String(value);
    if (el.value === nextValue) return false;
    el.value = nextValue;
    return true;
  }

  function isQuickResumeSleepScreenSelected() {
    const sleepScreen = findSetting('sleepScreen');
    const sleepScreenValue = getControlValue('sleepScreen');
    if (!sleepScreen || sleepScreenValue === undefined || !Number.isFinite(sleepScreenValue)) return false;

    let selectedValue = sleepScreenValue;
    if (Array.isArray(sleepScreen.values)) {
      selectedValue = Number(sleepScreen.values[sleepScreenValue]);
    } else if (Array.isArray(sleepScreen.options)) {
      const selectedOption = sleepScreen.options[sleepScreenValue];
      if (selectedOption && typeof selectedOption === 'object' && 'value' in selectedOption) {
        selectedValue = Number(selectedOption.value);
      }
    }

    return selectedValue === SLEEP_SCREEN_MODE.QUICK_RESUME;
  }

  function syncQuickResumeTimeoutForSleepScreen(sleepScreenChanged, quickResumeTimeoutChanged) {
    const timeoutValue = getControlValue('quickResumeSleepScreen');
    if (timeoutValue === undefined) return false;

    let changed = false;
    if (quickResumeTimeoutChanged) {
      preserveQuickResumeTimeoutOn = timeoutValue === 1;
      quickResumeTimeoutAutoEnabled = false;
    }

    if (isQuickResumeSleepScreenSelected()) {
      if (timeoutValue !== 1) {
        changed = setControlValue('quickResumeSleepScreen', 1);
        quickResumeTimeoutAutoEnabled = !preserveQuickResumeTimeoutOn;
      } else if (sleepScreenChanged && !preserveQuickResumeTimeoutOn) {
        quickResumeTimeoutAutoEnabled = true;
      }
      return changed;
    }

    if (sleepScreenChanged && quickResumeTimeoutAutoEnabled && !preserveQuickResumeTimeoutOn) {
      changed = setControlValue('quickResumeSleepScreen', 0);
      quickResumeTimeoutAutoEnabled = false;
    }
    return changed;
  }

  function updateSettingsVisibility() {
    const shortPwrBtnVal = getControlValue('shortPwrBtn');
    const pwrBtnFootnoteBackRow = document.getElementById('row-setting-pwrBtnFootnoteBack');
    if (pwrBtnFootnoteBackRow) {
      if (shortPwrBtnVal === 4) {
        pwrBtnFootnoteBackRow.style.display = '';
      } else {
        pwrBtnFootnoteBackRow.style.display = 'none';
      }
    }
  }

  function handleSettingChanged(key) {
    syncQuickResumeTimeoutForSleepScreen(key === 'sleepScreen', key === 'quickResumeSleepScreen');
    if (key === 'shortPwrBtn') {
      updateSettingsVisibility();
    }
    markChanged();
  }

  // --- Section nav ---
  // Links on laptops, a select on phones, both built from the rendered sections.
  // The active link follows scrolling; a tap pins it until the next user input.
  let pinnedSection = null;

  function slugify(name, fallback) {
    const s = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    return s || String(fallback);
  }

  function renderSectionNav(sections) {
    document.getElementById('section-links').innerHTML = sections.map(function(s) {
      return '<a href="#' + s.id + '">' + escapeHtml(s.name) + '</a>';
    }).join('');
    document.getElementById('sectionSelect').innerHTML = sections.map(function(s) {
      return '<option value="' + s.id + '">' + escapeHtml(s.name) + '</option>';
    }).join('');
    document.querySelector('.section-layout').classList.toggle('no-nav', sections.length === 0);
    updateActiveSection();
  }

  function updateActiveSection() {
    const links = document.querySelectorAll('#section-links a');
    if (!links.length) return;
    let current = pinnedSection;
    if (!current) {
      // Last section whose heading has reached the band under the topbar; at the
      // very bottom the final section counts even if it never gets that high.
      const atBottom = window.scrollY > 0 &&
        window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
      links.forEach(function(a) {
        const id = a.getAttribute('href').slice(1);
        const el = document.getElementById(id);
        if (!el) return;
        if (!current || atBottom || el.getBoundingClientRect().top <= 120) current = id;
      });
    }
    links.forEach(function(a) {
      a.classList.toggle('active', a.getAttribute('href') === '#' + current);
    });
    const select = document.getElementById('sectionSelect');
    if (current && select.value !== current) select.value = current;
  }

  function pinSection(id) {
    pinnedSection = id;
    updateActiveSection();
  }

  document.getElementById('section-links').addEventListener('click', function(e) {
    const a = e.target.closest('a');
    if (a) pinSection(a.getAttribute('href').slice(1));
  });
  document.getElementById('sectionSelect').addEventListener('change', function() {
    const el = document.getElementById(this.value);
    if (!el) return;
    pinSection(this.value);
    el.scrollIntoView();
  });
  ['wheel', 'touchstart', 'mousedown', 'keydown'].forEach(function(type) {
    window.addEventListener(type, function() { pinnedSection = null; }, { passive: true });
  });
  window.addEventListener('scroll', updateActiveSection, { passive: true });

  async function loadSettings() {
    try {
      const response = await fetch('/api/settings');
      if (!response.ok) {
        throw new Error('Failed to load settings: ' + response.status);
      }
      allSettings = await response.json();

      // Store original values
      originalValues = {};
      allSettings.forEach(function(s) {
        originalValues[s.key] = s.value;
      });

      // Group by category
      const groups = {};
      allSettings.forEach(function(s) {
        if (!groups[s.category]) groups[s.category] = [];
        groups[s.category].push(s);
      });

      const container = document.getElementById('settings-container');
      let html = '';
      const sections = [];

      for (const category in groups) {
        const id = 'section-' + slugify(category, sections.length);
        sections.push({ id: id, name: category });
        html += '<section class="card" id="' + id + '"><h2>' + escapeHtml(category) + '</h2><div class="list">';
        groups[category].forEach(function(s) {
          html += '<div class="row" id="row-setting-' + s.key + '">' +
            '<label class="row-main" for="setting-' + s.key + '">' + escapeHtml(s.name) + '</label>' +
            renderControl(s) +
            '</div>';
        });
        html += '</div></section>';
      }

      container.innerHTML = html;
      renderSectionNav(sections.concat([
        { id: 'section-wifi', name: 'Wi-Fi networks' },
        { id: 'section-opds', name: 'OPDS servers' }
      ]));
      updateSettingsVisibility();
      document.getElementById('save-container').classList.remove('show');
      document.getElementById('saveBtn').disabled = true;
      preserveQuickResumeTimeoutOn = getControlValue('quickResumeSleepScreen') === 1;
      quickResumeTimeoutAutoEnabled = false;
      if (syncQuickResumeTimeoutForSleepScreen(true, false)) {
        markChanged();
      }
    } catch (e) {
      console.error(e);
      document.getElementById('settings-container').innerHTML =
        '<section class="card"><p class="empty">Could not load settings. Reload the page to try again.</p></section>';
    }
  }

  async function saveSettings() {
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    // Collect only changed values
    const changes = {};
    allSettings.forEach(function(s) {
      const current = getValue(s);
      if (current !== undefined && current !== originalValues[s.key]) {
        changes[s.key] = current;
      }
    });

    if (Object.keys(changes).length === 0) {
      showMessage('No changes to save', false);
      btn.textContent = 'Save changes';
      updateSaveBar();
      return;
    }

    try {
      const response = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(changes)
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || 'Save failed');
      }

      // Update original values to new values
      for (const key in changes) {
        originalValues[key] = changes[key];
      }

      showMessage('Settings saved', false);
    } catch (e) {
      console.error(e);
      showMessage('Could not save settings: ' + e.message, true);
    }

    btn.textContent = 'Save changes';
    updateSaveBar();
  }

  // --- Wi-Fi Network Management ---
  // Renders an editable list of saved Wi-Fi networks using /api/wifi endpoints.
  // Password fields are never pre-filled; when left blank during edit, existing
  // passwords remain unchanged server-side.
  let wifiNetworks = [];

  function renderWifiNetwork(net, idx) {
    const isNew = idx === -1;
    const id = isNew ? 'new' : idx;
    const lastConnected = net.isLastConnected
      ? '<span class="row-meta">Last connected</span>'
      : '';

    return '<div class="list entry" id="wifi-' + id + '">' +
      '<div class="row">' +
        '<label class="row-main" for="wifi-ssid-' + id + '">Network name' + lastConnected + '</label>' +
        '<span class="row-control"><input type="text" id="wifi-ssid-' + id + '" value="' + escapeHtml(net.ssid || '') + '"></span>' +
      '</div>' +
      '<div class="row">' +
        '<label class="row-main" for="wifi-pass-' + id + '">Password' +
          (net.hasPassword ? '<span class="row-meta">Saved; leave blank to keep it</span>' : '') + '</label>' +
        '<span class="row-control"><input type="password" id="wifi-pass-' + id + '"></span>' +
      '</div>' +
      '<div class="row actions">' +
        '<button class="btn btn-sm" onclick="saveWifiNetwork(' + idx + ')">Save</button>' +
        (isNew ? '' : '<button class="btn btn-danger btn-sm" onclick="deleteWifiNetwork(' + idx + ')">Forget</button>') +
      '</div>' +
    '</div>';
  }

  function renderWifiSection() {
    const container = document.getElementById('wifi-container');
    let html = '<section class="card" id="section-wifi"><h2>Wi-Fi networks</h2>';

    if (wifiNetworks.length === 0) {
      html += '<p class="empty">No networks saved yet. Add one for the reader to join.</p>';
    } else {
      wifiNetworks.forEach(function(net, idx) {
        html += renderWifiNetwork(net, idx);
      });
    }

    html += '<div class="add-row">' +
      '<button class="btn btn-add" onclick="addWifiNetwork()">Add network</button>' +
    '</div></section>';
    container.innerHTML = html;
  }

  async function loadWifiNetworks() {
    try {
      const resp = await fetch('/api/wifi');
      if (!resp.ok) throw new Error('Failed to load');
      wifiNetworks = await resp.json();
      renderWifiSection();
    } catch (e) {
      console.error('Wi-Fi load error:', e);
    }
  }

  function addWifiNetwork() {
    const container = document.getElementById('wifi-container');
    const card = container.querySelector('.card');
    const addBtn = card.querySelector('.btn-add').parentElement;
    // Prevent multiple unsaved new-network forms at once (idx -1 -> id "new")
    if (document.getElementById('wifi-new')) return;
    addBtn.insertAdjacentHTML('beforebegin', renderWifiNetwork({ssid:'',hasPassword:false,isLastConnected:false}, -1));
  }

  async function saveWifiNetwork(idx) {
    const id = idx === -1 ? 'new' : idx;
    const ssid = document.getElementById('wifi-ssid-' + id).value.trim();
    if (!ssid) {
      showMessage('Enter the network name first', true);
      return;
    }

    const data = { ssid: ssid };
    // Only include password when the user actually typed something; omitting it
    // tells the server to preserve an existing password.
    const pass = document.getElementById('wifi-pass-' + id).value;
    if (pass) data.password = pass;
    if (idx >= 0) data.index = idx;

    try {
      const resp = await fetch('/api/wifi', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      if (!resp.ok) throw new Error(await resp.text());
      showMessage('Network saved', false);
      await loadWifiNetworks();
    } catch (e) {
      showMessage('Could not save network: ' + e.message, true);
    }
  }

  async function deleteWifiNetwork(idx) {
    const name = wifiNetworks[idx] && wifiNetworks[idx].ssid;
    if (!(await ui.confirm('Forget ' + (name || 'this network') + '?', { ok: 'Forget network', danger: true }))) return;
    try {
      const resp = await fetch('/api/wifi/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({index: idx})
      });
      if (!resp.ok) throw new Error(await resp.text());
      showMessage('Network forgotten', false);
      await loadWifiNetworks();
    } catch (e) {
      showMessage('Could not forget network: ' + e.message, true);
    }
  }

  // --- OPDS Server Management ---
  // Dynamically renders an editable list of OPDS servers, communicating with the
  // /api/opds REST endpoints. Password fields are never pre-filled for security;
  // a blank password on save keeps the existing one.
  let opdsServers = [];

  function renderOpdsServer(srv, idx) {
    const isNew = idx === -1;
    const id = isNew ? 'new' : idx;
    return '<div class="list entry" id="opds-' + id + '">' +
      '<div class="row">' +
        '<label class="row-main" for="opds-name-' + id + '">Name</label>' +
        '<span class="row-control"><input type="text" id="opds-name-' + id + '" value="' + escapeHtml(srv.name || '') + '"></span>' +
      '</div>' +
      '<div class="row">' +
        '<label class="row-main" for="opds-url-' + id + '">URL</label>' +
        '<span class="row-control"><input type="text" id="opds-url-' + id + '" value="' + escapeHtml(srv.url || '') + '"></span>' +
      '</div>' +
      '<div class="row">' +
        '<label class="row-main" for="opds-user-' + id + '">Username</label>' +
        '<span class="row-control"><input type="text" id="opds-user-' + id + '" value="' + escapeHtml(srv.username || '') + '"></span>' +
      '</div>' +
      '<div class="row">' +
        '<label class="row-main" for="opds-pass-' + id + '">Password' +
          (srv.hasPassword ? '<span class="row-meta">Saved; leave blank to keep it</span>' : '') + '</label>' +
        '<span class="row-control"><input type="password" id="opds-pass-' + id + '"></span>' +
      '</div>' +
      '<div class="row actions">' +
        '<button class="btn btn-sm" onclick="saveOpdsServer(' + idx + ')">Save</button>' +
        (isNew ? '' : '<button class="btn btn-danger btn-sm" onclick="deleteOpdsServer(' + idx + ')">Remove</button>') +
      '</div>' +
    '</div>';
  }

  function renderOpdsSection() {
    const container = document.getElementById('opds-container');
    let html = '<section class="card" id="section-opds"><h2>OPDS servers</h2>';

    if (opdsServers.length === 0) {
      html += '<p class="empty">No OPDS servers yet. Add one to browse its catalogue from the reader.</p>';
    } else {
      opdsServers.forEach(function(srv, idx) {
        html += renderOpdsServer(srv, idx);
      });
    }

    html += '<div class="add-row">' +
      '<button class="btn btn-add" onclick="addOpdsServer()">Add server</button>' +
    '</div></section>';
    container.innerHTML = html;
  }

  async function loadOpdsServers() {
    try {
      const resp = await fetch('/api/opds');
      if (!resp.ok) throw new Error('Failed to load');
      opdsServers = await resp.json();
      renderOpdsSection();
    } catch (e) {
      console.error('OPDS load error:', e);
    }
  }

  function addOpdsServer() {
    const container = document.getElementById('opds-container');
    const card = container.querySelector('.card');
    const addBtn = card.querySelector('.btn-add').parentElement;
    // Prevent multiple unsaved new-server forms at once (idx -1 → id "new")
    if (document.getElementById('opds-new')) return;
    addBtn.insertAdjacentHTML('beforebegin', renderOpdsServer({name:'',url:'',username:'',hasPassword:false}, -1));
  }

  async function saveOpdsServer(idx) {
    const id = idx === -1 ? 'new' : idx;
    const data = {
      name: document.getElementById('opds-name-' + id).value,
      url: document.getElementById('opds-url-' + id).value,
      username: document.getElementById('opds-user-' + id).value,
    };
    // Only include password in payload when the user actually typed something;
    // omitting it tells the server to keep the existing password.
    const pass = document.getElementById('opds-pass-' + id).value;
    if (pass) data.password = pass;
    if (idx >= 0) data.index = idx;

    try {
      const resp = await fetch('/api/opds', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      if (!resp.ok) throw new Error(await resp.text());
      showMessage('Server saved', false);
      await loadOpdsServers();
    } catch (e) {
      showMessage('Could not save server: ' + e.message, true);
    }
  }

  async function deleteOpdsServer(idx) {
    const name = opdsServers[idx] && opdsServers[idx].name;
    if (!(await ui.confirm('Remove ' + (name || 'this server') + '?', { ok: 'Remove server', danger: true }))) return;
    try {
      const resp = await fetch('/api/opds/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({index: idx})
      });
      if (!resp.ok) throw new Error(await resp.text());
      showMessage('Server removed', false);
      await loadOpdsServers();
    } catch (e) {
      showMessage('Could not remove server: ' + e.message, true);
    }
  }

  // Sequential, not concurrent: the device's web server handles one client
  // connection at a time, and three simultaneous fetches on page load can
  // stall long enough inside a single response to trip the firmware watchdog.
  (async () => {
    await loadSettings();
    await loadWifiNetworks();
    await loadOpdsServers();
  })();
</script>
  </body>
</html>
