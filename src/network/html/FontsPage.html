<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Fonts – e-Minimal</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/app.js" defer></script>
    <style>
      body[data-page="fonts"] #pickedInfo:empty { display: none; }
      body[data-page="fonts"] #uploadProgress { margin-top: 16px; }
      body[data-page="fonts"] #uploadProgress > p { margin: 8px 0 0; }
    </style>
  </head>
  <body data-page="fonts" data-title="Fonts">
    <main>
      <section class="card">
        <h2>Installed fonts</h2>
        <div class="list" id="families"><p class="empty">Loading fonts…</p></div>
      </section>

      <section class="card">
        <h2>Upload a font</h2>
        <form id="uploadForm">
          <div class="field">
            <label for="fontFiles">Font folder</label>
            <input type="file" id="fontFiles" webkitdirectory directory multiple required />
            <span class="field-hint">Choose the folder of one .cpfont family, one file per size (for example Bookerly_12.cpfont). Other files are skipped.</span>
            <span id="pickedInfo" class="field-hint"></span>
          </div>
          <button type="submit" class="btn btn-primary">Upload font</button>
        </form>
        <div id="uploadProgress" hidden>
          <div class="progress" aria-hidden="true"><span id="uploadBar" style="width:0%"></span></div>
          <p id="status" class="small muted" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>

  <script>
    function formatSize(bytes) {
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
      if (bytes >= 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return bytes + ' B';
    }

    async function loadFonts() {
      const el = document.getElementById('families');
      try {
        const res = await fetch('/api/fonts');
        const data = await res.json();
        // Build rows with DOM APIs and textContent so on-device family names
        // (which can contain arbitrary characters) cannot break markup or
        // execute script via innerHTML / inline onclick interpolation.
        el.replaceChildren();
        if (!data.families || data.families.length === 0) {
          const p = document.createElement('p');
          p.className = 'empty';
          p.textContent = 'No fonts on the card yet. Upload a .cpfont family to use it in books.';
          el.appendChild(p);
          return;
        }
        for (const f of data.families) {
          const row = document.createElement('div');
          row.className = 'row';

          const info = document.createElement('div');
          info.className = 'row-main';
          info.textContent = f.name;
          const meta = document.createElement('span');
          meta.className = 'row-meta';
          const sizes = (f.sizes || []).join(', ');
          const filesSizes = (f.files || []).map(fi => formatSize(fi.size)).join(' + ');
          meta.textContent = sizes + 'pt · ' + filesSizes;
          info.appendChild(meta);

          const actions = document.createElement('div');
          actions.className = 'actions';
          const btn = document.createElement('button');
          btn.className = 'btn btn-danger btn-sm';
          btn.textContent = 'Delete';
          btn.setAttribute('aria-label', 'Delete ' + f.name);
          // Capture name in the closure rather than interpolating into onclick.
          const familyName = f.name;
          btn.addEventListener('click', () => deleteFamily(familyName));
          actions.appendChild(btn);

          row.appendChild(info);
          row.appendChild(actions);
          el.appendChild(row);
        }
      } catch (e) {
        el.replaceChildren();
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'Could not load the font list. Reload the page to try again.';
        el.appendChild(p);
      }
    }

    async function deleteFamily(name) {
      if (!(await ui.confirm('Delete ' + name + '? Books using it fall back to the built-in font.', {ok: 'Delete font', danger: true}))) return;
      ui.toast('Deleting ' + name + '...');
      try {
        const res = await fetch('/api/fonts/delete', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({family: name})
        });
        if (res.ok) {
          ui.toast('Deleted "' + name + '".', 'ok');
        } else {
          ui.toast('Failed to delete "' + name + '".', 'danger');
        }
      } catch (err) {
        ui.toast('Delete error: ' + err.message, 'danger');
      }
      await loadFonts();
    }

    // Derive family name from a .cpfont filename: take everything before the
    // last '-' or '_' (that separator precedes the size suffix, e.g. Bookerly_12.cpfont).
    function familyFromFilename(name) {
      const stem = name.replace(/\.cpfont$/i, '');
      const cut = Math.max(stem.lastIndexOf('-'), stem.lastIndexOf('_'));
      return cut > 0 ? stem.slice(0, cut) : stem;
    }

    // Sanitize to match firmware's [A-Za-z0-9_-]+ pattern.
    function sanitizeFamily(raw) {
      return raw.replace(/[^A-Za-z0-9_-]/g, '_');
    }

    function cpfontFilesOnly(fileList) {
      return Array.from(fileList).filter(f => /\.cpfont$/i.test(f.name));
    }

    document.getElementById('fontFiles').addEventListener('change', function() {
      const info = document.getElementById('pickedInfo');
      const files = cpfontFilesOnly(this.files);
      if (files.length === 0) {
        info.textContent = 'No .cpfont files found in the selected folder.';
        return;
      }
      const family = sanitizeFamily(familyFromFilename(files[0].name));
      info.textContent = files.length + ' file' + (files.length === 1 ? '' : 's') +
        ' selected, family "' + family + '"';
    });

    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const status = document.getElementById('status');
      const bar = document.getElementById('uploadBar');
      const files = cpfontFilesOnly(document.getElementById('fontFiles').files);
      if (files.length === 0) {
        ui.toast('No .cpfont files selected.', 'danger');
        return;
      }

      // A directory picker may include files from multiple family subfolders.
      // Reject that up front — otherwise files[0]'s family is silently reused
      // for every upload, corrupting the install layout.
      const families = [...new Set(files.map(f => sanitizeFamily(familyFromFilename(f.name))))];
      if (families.length !== 1) {
        ui.toast('Please select files from a single font family.', 'danger');
        return;
      }
      const family = families[0];

      document.getElementById('uploadProgress').hidden = false;
      bar.style.width = '0%';

      let uploaded = 0;
      for (const file of files) {
        status.textContent = 'Uploading ' + (uploaded + 1) + '/' + files.length + ': ' + file.name;
        const formData = new FormData();
        formData.append('family', family);
        formData.append('file', file, file.name);
        try {
          const res = await fetch('/api/fonts/upload', { method: 'POST', body: formData });
          const data = await res.json();
          if (!data.ok) {
            status.textContent = 'Failed on ' + file.name + ': ' + (data.error || 'unknown error');
            ui.toast(status.textContent, 'danger');
            await loadFonts();
            return;
          }
        } catch (err) {
          status.textContent = 'Upload error on ' + file.name + ': ' + err.message;
          ui.toast(status.textContent, 'danger');
          await loadFonts();
          return;
        }
        uploaded++;
        bar.style.width = Math.round(uploaded / files.length * 100) + '%';
      }

      status.textContent = 'Uploaded ' + uploaded + ' file' + (uploaded === 1 ? '' : 's') +
        ' to family "' + family + '".';
      ui.toast(status.textContent, 'ok');
      await loadFonts();
    });

    loadFonts();
  </script>
  </body>
</html>
